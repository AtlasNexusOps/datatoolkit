[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-datatoolkit"
version = "0.1.0"
description = "CLI for converting, validating, cleaning and batching operational data files (JSON ↔ CSV ↔ YAML ↔ XML)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Atlas Nexus", email = "dev@atlasnexus.tech"},
]
keywords = ["cli", "data", "csv", "json", "yaml", "xml", "convert", "validate", "clean"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "xmltodict>=0.13",
]

[project.urls]
Homepage = "https://github.com/AtlasNexusTech/datatoolkit"
Repository = "https://github.com/AtlasNexusTech/datatoolkit"
Issues = "https://github.com/AtlasNexusTech/datatoolkit/issues"

[project.scripts]
datatoolkit = "datatoolkit.cli:main"
dtk = "datatoolkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/datatoolkit"]

[tool.hatch.build.targets.sdist]
include = [
    "src/datatoolkit/**/*.py",
    "README.md",
    "LICENSE",
]
