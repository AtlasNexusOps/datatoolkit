name: Build Windows EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install pyyaml xmltodict pyinstaller

      - name: Build .exe
        run: |
          pyinstaller --onefile --name datatoolkit --console `
            --add-data "vendor/xmltodict.py;vendor" `
            src/datatoolkit/cli.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: datatoolkit-windows
          path: dist/datatoolkit.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: datatoolkit-windows

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: datatoolkit.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
