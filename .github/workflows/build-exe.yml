name: Build Windows EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml xmltodict pyinstaller

      - name: Build .exe
        run: |
          pyinstaller --onefile --name datatoolkit --console src/datatoolkit/cli.py
          dir dist

      - name: Upload to Release
        shell: bash
        run: |
          gh release upload v0.1.0 dist/datatoolkit.exe --clobber --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
